<title>Llegada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dónde está tu tren, si lleva retraso y a qué hora salir a recoger a alguien.">
<meta name="theme-color" content="#f4f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de una pantalla. Barra superior con estado de los datos, la vista activa en el centro y las pestañas abajo (izquierda en escritorio). Tarjetas blancas sobre un fondo gris verdoso; el azul marca lo que se puede tocar y el ámbar es el punto de la marca. */
:root{
  --bg:#f4f5f2; --surface:#ffffff; --sunk:#eceee9; --line:#dcdfd8; --line-2:#e7e9e4; --fg:#16191c; --muted:#5d645e; --faint:#8a918a;
  --accent:#1f56b8; --accent-ink:#ffffff; --accent-soft:#e2e9f7; --brand:#f2a531;
  --ok:#1b8a4c; --warn:#b97000; --bad:#c7362b; --none:#8c928b;
  --ok-soft:#e1f2e8; --warn-soft:#fbefd9; --bad-soft:#f9e3e0;
  --land:#ffffff; --land-2:#ecefe9; --sea:#dde4e5; --coast:#bcc3bb; --rail:#c9cfc7; --station:#a2aaa2;
  --shadow:0 1px 2px rgba(20,24,28,.05),0 6px 20px rgba(20,24,28,.08);
  --shadow-lg:0 2px 6px rgba(20,24,28,.08),0 18px 48px rgba(20,24,28,.16);
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101214; --surface:#191c1f; --sunk:#202428; --line:#2d3237; --line-2:#24292d; --fg:#eaece8; --muted:#9ba29c; --faint:#6f7670;
  --accent:#7ea8f2; --accent-ink:#0c1322; --accent-soft:#1c2940; --brand:#f2a531;
  --ok:#43c27a; --warn:#f0a83a; --bad:#f06a5d; --none:#6e756f;
  --ok-soft:#16301f; --warn-soft:#352812; --bad-soft:#3a1d1a;
  --land:#1c2023; --land-2:#16191b; --sea:#0c0e10; --coast:#353b40; --rail:#2f363b; --station:#4c554f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.35); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#191c1f; --sunk:#202428; --line:#2d3237; --line-2:#24292d; --fg:#eaece8; --muted:#9ba29c; --faint:#6f7670;
  --accent:#7ea8f2; --accent-ink:#0c1322; --accent-soft:#1c2940; --brand:#f2a531;
  --ok:#43c27a; --warn:#f0a83a; --bad:#f06a5d; --none:#6e756f;
  --ok-soft:#16301f; --warn-soft:#352812; --bad-soft:#3a1d1a;
  --land:#1c2023; --land-2:#16191b; --sea:#0c0e10; --coast:#353b40; --rail:#2f363b; --station:#4c554f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.35); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}

/* Barra superior */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:0}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-weight:800;font-stretch:118%;font-size:20px;letter-spacing:-.015em}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:600;white-space:nowrap;border:0;min-width:0}
.status span{overflow:hidden;text-overflow:ellipsis}
.status i{width:8px;height:8px;border-radius:50%;background:var(--none);flex:none}
.status[data-mode="live"] i{background:var(--ok);animation:pulse 2s infinite}
.status[data-mode="mirror"] i{background:var(--warn)}
.status[data-mode="snapshot"] i{background:var(--accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{stroke-width:2.2}
.main{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pad>*{min-width:0}
h1{font-size:28px;line-height:1.1;font-weight:800;font-stretch:115%;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:800;font-stretch:110%;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
p{margin:0}
.lede{color:var(--muted);max-width:62ch}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px}
.sec-h .link{margin-left:auto}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:13.5px;padding:4px 0}
.muted{color:var(--muted)}

/* Piezas comunes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card.pad-in{padding:16px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.none{background:var(--sunk);color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.av{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn svg,.ic{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .num{opacity:.7;font-size:12px}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty b{color:var(--fg)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:13.5px;align-items:flex-start}
.notice .ic{stroke:var(--accent);margin-top:1px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-none{background:var(--none)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:var(--fg);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:13.5px;z-index:40;width:max-content;max-width:min(92vw,440px);box-shadow:var(--shadow-lg)}
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Listas de trenes (inicio, estación, trayectos) */
.trains{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;width:100%}
.tr:last-child{border-bottom:0}
.tr:hover{background:color-mix(in srgb,var(--sunk) 50%,transparent)}
.tr .time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;line-height:1.1}
.tr .time s{display:block;font-size:12px;color:var(--faint);font-weight:500}
.tr .time.late{color:var(--bad)}.tr .time.mid{color:var(--warn)}
.tr .what{min-width:0}
.tr .what b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.tr .what span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tr .side small{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.tr.gone{opacity:.5}

/* Inicio */
.hello small{display:block;color:var(--muted);font-weight:600;margin-bottom:4px}
.route-card{display:flex;flex-direction:column}
.route-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.route-head b{font-size:16.5px;font-weight:800;font-stretch:108%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route-head .arrow{color:var(--faint)}
.route-head .x{margin-left:auto;border:0;background:none;color:var(--faint);padding:4px;border-radius:8px}
.next-hero{margin:0 14px 10px;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:end}
.next-hero small{grid-column:1/-1;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.next-hero b{font-size:34px;line-height:1;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}
.next-hero span{font-size:13.5px;opacity:.92}
.next-hero .in{text-align:right;font-weight:800;font-size:15px}

/* Mapa */
#v-mapa{overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--sea)}
#map.drag{cursor:grabbing}
.mapbar{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.mapbar>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:13px;box-shadow:var(--shadow);padding:0 12px;max-width:440px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;padding:12px 0;width:100%;outline:none;min-width:0}
.mapbar .chip{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.results{background:var(--surface);border-radius:13px;box-shadow:var(--shadow-lg);max-width:440px;max-height:50vh;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;background:none;border:0;border-bottom:1px solid var(--line-2)}
.results button:last-child{border-bottom:0}
.results .mid{min-width:0}.results .mid b{display:block}.results .mid span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;background:var(--surface);border-radius:11px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 92px)}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.mapbtns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.mapbtns button{width:44px;height:44px;border-radius:13px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.mapbtns svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round}

/* Ficha del tren */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);z-index:20;display:flex;flex-direction:column}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .body{overflow:auto;padding-block:10px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .body>*{flex:none}
.th{display:flex;align-items:flex-start;gap:12px}
.th .x{margin-left:auto;border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center}
.tname{font-size:22px;font-weight:800;font-stretch:112%;line-height:1.15;margin-top:6px;text-wrap:balance}
.tsub{color:var(--muted);font-size:13px;margin-top:3px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--surface);padding:10px 11px;min-width:0}
.facts small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.facts b{display:block;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route{list-style:none;margin:0;padding:0}
.route li{display:grid;grid-template-columns:50px 18px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.route .t{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.route .k{position:relative;height:100%;display:grid;place-items:center}
.route .k::before{content:"";position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--line);left:50%;transform:translateX(-50%)}
.route li:first-child .k::before{top:50%}
.route li:last-child .k::before{bottom:50%}
.route .k i{width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.route li.past{color:var(--muted)}
.route li.past .k::before{background:var(--accent)}
.route li.past .k i{border-color:var(--accent);background:var(--accent)}
.route li.next .k i{border-color:var(--accent);width:15px;height:15px;box-shadow:0 0 0 4px var(--accent-soft)}
.route li.next b{font-weight:800}
.route .eta{font-family:var(--f-num);font-size:13px;font-weight:600}
.route .here{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.hist{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--sunk);font-size:13.5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;flex:1;min-width:70px}
.bar i{display:block;height:100%}

/* Estación */
.st-head{display:flex;flex-direction:column;gap:12px}
.st-title{display:flex;align-items:flex-start;gap:10px}
.st-title h1{min-width:0;overflow-wrap:anywhere}
.star{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.star svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.star[aria-pressed="true"] svg{fill:var(--brand);stroke:var(--brand)}
.st-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.picker{position:relative}
.picker .results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;max-width:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Recoger */
.big{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:16px;background:var(--accent);color:var(--accent-ink)}
.big small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.85}
.big b{font-size:56px;line-height:1;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}
.big span{font-size:14.5px;opacity:.92}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi small{font-size:11.5px;color:var(--muted);font-weight:700;display:block}
.kpi b{font-size:24px;font-weight:800;font-stretch:108%;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted)}

/* Tú */
.setting{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line-2)}
.setting:last-child{border-bottom:0}
.setting .txt{min-width:0;flex:1}
.setting .txt b{display:block;font-weight:700}
.setting .txt span{display:block;font-size:12.5px;color:var(--muted)}
.setting .input{width:auto;max-width:200px;padding:8px 10px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .2s;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .tn{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--muted);width:48px}
.li .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid span{font-size:12.5px;color:var(--muted)}
